name: Bug report
description: Something in Beads for Laravel does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps (and bd commands, if relevant) that shows the problem.
      placeholder: |
        1. bd create --title="…"
        2. Open /beads/board
        3. Drag the card to …
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: bd-version
    attributes:
      label: bd version
      description: The output of `bd --version`.
      placeholder: bd version 1.3.2 (Homebrew)
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: PHP and Laravel version
      placeholder: PHP 8.4, Laravel 13.1
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: How do you serve the app?
      options: [Laravel Herd, Valet, php artisan serve, Docker / Sail, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Browser console errors, the API response, or storage/logs/laravel.log.
      render: shell
